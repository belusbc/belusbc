<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대리점 문의 | 벨루스톤카페 부천점</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .agency-section { padding: 150px 0 100px; }
        .agency-container { max-width: 800px; margin: 0 auto; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="page-products">
    <!-- Header -->
    <header id="header" class="scrolled-always">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="벨루스톤카페 로고" class="logo-img">
                벨루스톤카페 <span>부천점</span>
            </a>
            <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
            <nav class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="products.html">Products</a>
                <a href="index.html#contact">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Agency Form Section -->
    <section class="agency-section bg-light">
        <div class="container">
            <div class="agency-container">
                <div class="section-title" style="margin-bottom: 40px;">
                    <h2>대리점 문의</h2>
                    <p>벨루스톤과 함께 성장할 소중한 파트너를 모십니다.</p>
                </div>
                <form class="contact-form" onsubmit="event.preventDefault(); sendAgencySMS();">
                    <div class="form-group">
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">성함 또는 상호명</label>
                        <input type="text" id="agencyName" placeholder="성함 또는 상호명을 입력해주세요" required>
                    </div>
                    <div class="form-group">
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">연락처</label>
                        <input type="tel" id="agencyPhone" placeholder="연락처를 입력해주세요" required>
                    </div>
                    <div class="form-group">
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">문의 내용</label>
                        <textarea id="agencyMessage" rows="6" placeholder="지역, 창업 희망 시기 등 궁금하신 점을 편하게 남겨주세요." required></textarea>
                    </div>
                    <button type="submit" class="btn-primary w-100" style="margin-top: 20px; padding: 20px; font-size: 1.2rem;">문자로 대리점 문의 접수하기</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-logo">
                <img src="logo.png" alt="벨루스톤카페 로고" class="footer-logo-img">
                벨루스톤카페 <span>부천점</span>
            </div>
            <p class="copyright">&copy; 2026 Belustone Healing Cafe Bucheon. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
