<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벨루스톤 소개 | 벨루스톤카페 부천점</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-section { padding: 150px 0 100px; }
        
        .masonry-grid {
            column-count: 3;
            column-gap: 20px;
        }
        @media (max-width: 900px) {
            .masonry-grid { column-count: 2; }
        }
        @media (max-width: 600px) {
            .masonry-grid { column-count: 1; }
        }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .masonry-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(49, 130, 206, 0.2);
        }
        
        .masonry-item:hover img {
            transform: scale(1.05);
        }

        .masonry-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
        }

        .masonry-item:hover .masonry-overlay {
            opacity: 1;
        }

        .masonry-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Category Filter Buttons */
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 25px;
            border-radius: 30px;
            background: white;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body class="page-products">
    <!-- Header -->
    <header id="header" class="scrolled-always">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="벨루스톤카페 로고" class="logo-img">
                벨루스톤카페 <span>부천점</span>
            </a>
            <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
            <nav class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="products.html">Products</a>
                <a href="reviews.html">Reviews</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="index.html#contact">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Gallery Section -->
    <section class="gallery-section bg-light">
        <div class="container">
            <div class="section-title text-center fade-in-section" style="margin-bottom: 40px;">
                <h2>벨루스톤을 소개합니다</h2>
                <p>매장 전경부터 다양한 힐링 아이템까지 한눈에 확인해 보세요.</p>
            </div>
            
            <div class="filter-buttons fade-in-section">
                <button class="filter-btn active" data-filter="all">전체 보기</button>
                <button class="filter-btn" data-filter="store">매장 전경</button>
                <button class="filter-btn" data-filter="product">주요 제품</button>
            </div>

            <div class="masonry-grid" id="galleryGrid">
                <!-- Store Photos -->
                <div class="masonry-item store">
                    <img src="매장1.jpeg" alt="매장 전경 1">
                    <div class="masonry-overlay"><h3 class="masonry-title">아늑한 매장 전경</h3></div>
                </div>
                <div class="masonry-item store">
                    <img src="매장2.jpeg" alt="매장 전경 2">
                    <div class="masonry-overlay"><h3 class="masonry-title">편안한 휴식 공간</h3></div>
                </div>
                <div class="masonry-item store">
                    <img src="매장3.jpeg" alt="매장 전경 3">
                    <div class="masonry-overlay"><h3 class="masonry-title">스톤 테라피룸</h3></div>
                </div>
                <div class="masonry-item store">
                    <img src="매장4.jpeg" alt="매장 전경 4">
                    <div class="masonry-overlay"><h3 class="masonry-title">깔끔한 인테리어</h3></div>
                </div>
                <div class="masonry-item store">
                    <img src="매장5.jpeg" alt="매장 전경 5">
                    <div class="masonry-overlay"><h3 class="masonry-title">힐링 라운지</h3></div>
                </div>
                <div class="masonry-item store">
                    <img src="매장6.jpeg" alt="매장 전경 6">
                    <div class="masonry-overlay"><h3 class="masonry-title">대기 공간</h3></div>
                </div>

                <!-- Product Photos -->
                <div class="masonry-item product">
                    <img src="도자기1.png" alt="도자기 제품">
                    <div class="masonry-overlay"><h3 class="masonry-title">스페셜 스톤 테라피</h3></div>
                </div>
                <div class="masonry-item product">
                    <img src="화장품1.png" alt="화장품 제품">
                    <div class="masonry-overlay"><h3 class="masonry-title">EWG 그린 코스메틱</h3></div>
                </div>
                <div class="masonry-item product">
                    <img src="이너뷰티1.png" alt="이너뷰티 제품">

                </div>
            </div>
        </div>
    </section>

    <!-- Lightbox (Full Screen Image Viewer) -->
    <div id="lightbox" class="modal" style="display: none; background-color: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; left: 0; top: 0; width: 100%; height: 100%; pointer-events: auto;">
        <span id="lightboxClose" class="close-btn" style="color: white; top: 20px; right: 30px; font-size: 3rem; background: transparent; box-shadow: none;">&times;</span>
        <img id="lightboxImg" src="" alt="확대된 이미지" style="max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 0 50px rgba(255,255,255,0.1);">
    </div>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-logo">
                <img src="logo.png" alt="벨루스톤카페 로고" class="footer-logo-img">
                벨루스톤카페 <span>부천점</span>
            </div>
            <p class="copyright">&copy; 2026 Belustone Healing Cafe Bucheon. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Gallery Filter Logic
        const filterBtns = document.querySelectorAll('.filter-btn');
        const masonryItems = document.querySelectorAll('.masonry-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');

                masonryItems.forEach(item => {
                    if (filterValue === 'all' || item.classList.contains(filterValue)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // Lightbox Logic
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');

        masonryItems.forEach(item => {
            item.addEventListener('click', () => {
                const imgSource = item.querySelector('img').src;
                lightboxImg.src = imgSource;
                lightbox.style.display = 'flex';
            });
        });

        lightboxClose.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                lightbox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
